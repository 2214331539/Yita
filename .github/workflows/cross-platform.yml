name: Cross-platform architecture

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    paths:
      - 'Yita.CrossPlatform.sln'
      - 'src/Yita.Core/**'
      - 'src/Yita.App/**'
      - 'src/Yita.Desktop/**'
      - 'src/Yita.Native.Windows/**'
      - 'src/Yita.Native.Windows.UIA.Worker/**'
      - 'src/Yita.Native.Mac/**'
      - 'src/Yita.Native.Mac.Helper/**'
      - 'scripts/Build-Mac-Helper.sh'
      - 'tests/Yita.Core.Tests/**'
      - 'tests/Yita.Core.Parity.Tests/**'
      - 'tests/Yita.Native.Windows.Tests/**'
      - 'tests/Yita.Native.Mac.Tests/**'
      - 'tests/Yita.Desktop.Tests/**'
      - 'tools/Yita.PlatformSmoke/**'
      - 'tools/Yita.MacHelperSmoke/**'
      - '.github/workflows/cross-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build cross-platform solution
        run: dotnet build Yita.CrossPlatform.sln --configuration Release

      - name: Run Core, native adapter and desktop interaction tests
        run: dotnet test Yita.CrossPlatform.sln --configuration Release --no-build --logger "console;verbosity=minimal"

      - name: Verify cross-process single instance and activation
        run: dotnet run --project tools/Yita.PlatformSmoke/Yita.PlatformSmoke.csproj --configuration Release --no-build

      - name: Verify native helper client against an isolated test peer
        run: dotnet run --project tools/Yita.MacHelperSmoke/Yita.MacHelperSmoke.csproj --configuration Release --no-build

      - name: Verify Swift helper protocol without GUI authorization
        if: runner.os == 'macOS'
        run: dotnet run --project tools/Yita.MacHelperSmoke/Yita.MacHelperSmoke.csproj --configuration Release --no-build -- --helper src/Yita.Desktop/bin/Release/net8.0/Yita.Native.Mac.Helper.app/Contents/MacOS/Yita.Native.Mac.Helper

      - name: Verify AX selection policy against deterministic fixtures
        if: runner.os == 'macOS'
        run: src/Yita.Desktop/bin/Release/net8.0/Yita.Native.Mac.Helper.app/Contents/MacOS/Yita.Native.Mac.Helper --selection-self-test
