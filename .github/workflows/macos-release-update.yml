name: Update existing Mac release installer

on:
  push:
    branches: ['codex/mac-selection-reliability']
    paths: ['.github/workflows/macos-release-update.yml', 'tests/Yita.Native.Mac.Tests/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-update-preview-3
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.9.0-preview.3
  PACKAGE_VERSION: 0.9.0-preview.3
  MAC_BUILD_NUMBER: '4'

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test current cross-platform sources
        run: |
          test "$(uname -m)" = arm64
          test "v$(plutil -extract version raw -o - packaging/release-version.json)" = "$RELEASE_TAG"
          dotnet build Yita.CrossPlatform.sln -c Release
          dotnet test Yita.CrossPlatform.sln -c Release --no-build --logger "console;verbosity=minimal"
          dotnet run --project tools/Yita.PlatformSmoke/Yita.PlatformSmoke.csproj -c Release --no-build
          dotnet run --project tools/Yita.MacHelperSmoke/Yita.MacHelperSmoke.csproj -c Release --no-build
      - name: Build and validate the replacement Apple Silicon bundle
        run: bash scripts/Build-Mac-Preview.sh "$GITHUB_WORKSPACE/artifacts/macos-update" "$MAC_BUILD_NUMBER" "$PACKAGE_VERSION"
      - name: Prepare only the Mac installer and internal validation metadata
        run: |
          mkdir -p artifacts/mac-release-update
          cp "artifacts/macos-update/Yita-$PACKAGE_VERSION-osx-arm64.dmg" artifacts/mac-release-update/Yita.dmg
          cp "artifacts/macos-update/Yita-$PACKAGE_VERSION-osx-arm64.build.json" artifacts/mac-release-update/build.json
          cd artifacts/mac-release-update
          shasum -a 256 Yita.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release-update-${{ github.run_id }}
          path: artifacts/mac-release-update/*
          if-no-files-found: error
          retention-days: 30

  replace:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-release-update-${{ github.run_id }}
          path: artifacts/mac-release-update
      - name: Verify the replacement, rotate the Mac asset and preserve Windows
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const repo = context.repo;
            const version = process.env.PACKAGE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const bytes = fs.readFileSync('artifacts/mac-release-update/Yita.dmg');
            const hash = crypto.createHash('sha256').update(bytes).digest('hex');
            const metadata = JSON.parse(fs.readFileSync('artifacts/mac-release-update/build.json', 'utf8'));
            const checksum = fs.readFileSync('artifacts/mac-release-update/SHA256SUMS.txt', 'utf8').trim();
            if (checksum !== `${hash}  Yita.dmg` || metadata.commit !== context.sha || metadata.version !== version
                || metadata.rid !== 'osx-arm64' || metadata.worktreeDirty !== false
                || metadata.buildNumber !== Number(process.env.MAC_BUILD_NUMBER)) {
              throw new Error('Replacement must match the clean source commit, build number and checksum.');
            }
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
            if (release.id !== 408887514 || release.draft || !release.prerelease) throw new Error('Unexpected target release.');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: release.id });
            const windows = assets.find(asset => asset.name === 'Yita-Setup.exe');
            const old = assets.find(asset => asset.name === 'Yita.dmg');
            if (assets.length !== 2 || windows?.id !== 627737097
                || windows.digest !== 'sha256:a379088edbf982c0b6f518faf7ced7ef71e38fe7aa06c58fa1e3a32517d40482'
                || old?.id !== 627737099
                || old.digest !== 'sha256:7838fde345b94cd1aed0253c083c424cae5a72e6a890176126f04330578d6c6b') {
              throw new Error('Release assets changed; refusing to overwrite an unexpected installer.');
            }
            const stagedName = `Yita.dmg.pending-${context.runId}`;
            const backupName = `Yita.dmg.previous-${context.runId}`;
            const { data: staged } = await github.rest.repos.uploadReleaseAsset({
              ...repo, release_id: release.id, name: stagedName,
              label: `Apple Silicon · build ${process.env.MAC_BUILD_NUMBER} · ${context.sha}`,
              data: bytes, headers: { 'content-type': 'application/x-apple-diskimage', 'content-length': bytes.length }
            });
            let oldRenamed = false;
            let newRenamed = false;
            let bodyUpdated = false;
            const rename = (asset_id, name) => github.rest.repos.updateReleaseAsset({ ...repo, asset_id, name });
            const verifyStaged = async () => {
              const { data: asset } = await github.rest.repos.getReleaseAsset({ ...repo, asset_id: staged.id });
              if (asset.size !== bytes.length || asset.digest !== `sha256:${hash}` || asset.state !== 'uploaded') {
                throw new Error('Uploaded Mac installer checksum or size differs.');
              }
              return asset;
            };
            try {
              await verifyStaged();
              // Retain the old binary until the verified replacement is downloadable.
              await rename(old.id, backupName);
              oldRenamed = true;
              await rename(staged.id, 'Yita.dmg');
              newRenamed = true;
              const asset = await verifyStaged();
              const response = await fetch(asset.browser_download_url, { redirect: 'follow', cache: 'no-store', signal: AbortSignal.timeout(45000) });
              if (!response.ok) throw new Error(`Mac download check failed: ${response.status}`);
              const downloadedHash = crypto.createHash('sha256');
              let downloadedBytes = 0;
              for await (const chunk of response.body) { downloadedHash.update(chunk); downloadedBytes += chunk.length; }
              if (downloadedBytes !== bytes.length || downloadedHash.digest('hex') !== hash) {
                throw new Error('The public Mac download must match the new installer checksum and size.');
              }
              const intro = 'Windows 和 M 系列 Mac 均从同一标签、同一干净源码构建';
              let body = (release.body || '').replace(intro, 'Windows 安装包保留原标签构建，Mac 安装包已单独更新为取词修复构建');
              const note = fs.readFileSync('docs/releases/v0.9.0-preview.3-mac-update.md', 'utf8').trim();
              const source = `Mac 打包源码：[${context.sha.slice(0, 7)}](https://github.com/${repo.owner}/${repo.repo}/commit/${context.sha})。`;
              body += `\n\n${note}\n\n${source}\n`;
              await github.rest.repos.updateRelease({ ...repo, release_id: release.id, body });
              bodyUpdated = true;
            } catch (error) {
              // Restore the old download if validation or publication fails before cleanup.
              if (newRenamed) await rename(staged.id, stagedName);
              if (oldRenamed) await rename(old.id, 'Yita.dmg');
              if (bodyUpdated) await github.rest.repos.updateRelease({ ...repo, release_id: release.id, body: release.body });
              await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: staged.id });
              throw error;
            }
            await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: old.id });
            const final = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: release.id });
            const preserved = final.find(asset => asset.id === windows.id);
            const installed = final.find(asset => asset.name === 'Yita.dmg');
            if (final.length !== 2 || preserved?.digest !== windows.digest || installed?.id !== staged.id
                || installed.digest !== `sha256:${hash}`) throw new Error('Final release must contain the new Mac DMG and the original Windows Setup only.');
            core.info(`Updated ${tag}: Yita.dmg (${bytes.length} bytes; SHA256 ${hash}). Windows installer preserved.`);
