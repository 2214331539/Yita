name: Clean published release assets

on:
  push:
    branches: ['codex/platform-host-services']
    paths: ['.github/workflows/cleanup-release-assets.yml']

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clean the two reviewed releases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            if (owner !== '2214331539' || repo !== 'Yita') throw new Error('Unexpected repository.');
            const plans = [
              {
                tag: 'v0.9.0-preview.1', id: 402569694,
                keep: [
                  [608032386, 'Yita-Setup-0.9.0-preview.1-win-x64.exe', '9b48a4db4fb2c213f6bd7c95c489eb68acc5fa392203645bb89fb194e67f1aa6'],
                  [608032385, 'Yita-0.9.0-preview.1-osx-arm64.dmg', '6365c3a36a1de83758799b9b949f69b66a03a9d7b43f12271200697458f9004a'],
                  [608121845, 'SHA256SUMS.txt', '798b759f2e86cb9faae41ad0cf84ec92fd7718fce5b0f6c9f4bb6ad946c4ed92']
                ],
                remove: [
                  [608032388, 'SHA256SUMS-osx-arm64.txt'],
                  [608032383, 'SHA256SUMS-win-x64.txt'],
                  [608032381, 'SHA256SUMS.txt'],
                  [608032384, 'TESTING.md'],
                  [608032376, 'WINDOWS_TESTING.md'],
                  [608032375, 'Yita-0.9.0-preview.1-osx-arm64.build.json'],
                  [608032378, 'Yita-0.9.0-preview.1-osx-arm64.zip'],
                  [608032377, 'Yita-0.9.0-preview.1-win-x64.build.json'],
                  [608032379, 'Yita-0.9.0-preview.1-win-x64.payload.json'],
                  [608032387, 'Yita-0.9.0-preview.1-win-x64.zip']
                ]
              },
              {
                tag: 'v0.8.4', id: 397621924,
                keep: [
                  [592783861, 'Yita-Setup-0.8.4-win-x64.exe', '2218f869b56b34ee38c46747d3d7c40078d90a30a325aee41765dd49c7b1ffb6'],
                  [592783858, 'Yita-Setup-0.8.4-win-x64.exe.sha256', '1ddf0283d53925930c39ea86789add9cb2c40715918a5e6789a45867d33adf85']
                ],
                remove: [[592783859, 'Yita-0.8.4-payload.json']]
              }
            ];
            const snapshots = [];
            for (const plan of plans) {
              const { data: release } = await github.rest.repos.getReleaseByTag({owner, repo, tag: plan.tag});
              if (release.id !== plan.id || release.draft) throw new Error('Unexpected release identity.');
              for (const [id, name, hash] of plan.keep) {
                const asset = release.assets.find(a => a.id === id);
                const temporaryChecksum = id === 608121845 && asset?.name === 'SHA256SUMS-installers.txt';
                if (!asset || (asset.name !== name && !temporaryChecksum) || asset.digest !== 'sha256:' + hash) {
                  throw new Error('Protected asset changed: ' + name);
                }
              }
              const reviewed = new Set([...plan.keep, ...plan.remove].map(a => a[0]));
              if (release.assets.some(a => !reviewed.has(a.id))) throw new Error('Unreviewed attachment found.');
              for (const [id, name] of plan.remove) {
                const asset = release.assets.find(a => a.id === id);
                if (asset && asset.name !== name) throw new Error('Removal identity changed.');
              }
              snapshots.push(release);
            }
            fs.mkdirSync('artifacts/release-cleanup', {recursive: true});
            fs.writeFileSync('artifacts/release-cleanup/before.json', JSON.stringify(snapshots, null, 2));
            for (const [index, plan] of plans.entries()) {
              for (const [asset_id] of plan.remove) {
                if (snapshots[index].assets.some(a => a.id === asset_id)) {
                  await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id});
                }
              }
            }
            await github.rest.repos.updateReleaseAsset({owner, repo, asset_id: 608121845, name: 'SHA256SUMS.txt'});
            await github.rest.repos.updateRelease({
              owner, repo, release_id: 402569694,
              body: fs.readFileSync('docs/releases/v0.9.0-preview.1.md', 'utf8')
            });
            const results = [];
            for (const plan of plans) {
              const {data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag: plan.tag});
              if (release.assets.length !== plan.keep.length) throw new Error('Unexpected final asset count.');
              for (const [id, name, hash] of plan.keep) {
                const asset = release.assets.find(a => a.id === id);
                if (!asset || asset.name !== name || asset.digest !== 'sha256:' + hash) {
                  throw new Error('Final asset verification failed: ' + name);
                }
              }
              results.push(release);
              core.info(plan.tag + ': ' + release.assets.map(a => a.name).join(', '));
            }
            fs.writeFileSync('artifacts/release-cleanup/after.json', JSON.stringify(results, null, 2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-cleanup-record
          path: artifacts/release-cleanup/*.json
          if-no-files-found: warn
          retention-days: 30
